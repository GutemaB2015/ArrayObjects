<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects and Array in JS</title>
</head>
<body>
            <input type="text" id="name" placeholder="Enter your name">
            <input type="number" id="marks" placeholder="Enter your mark">
            <button id="addstudent">Add Student</button>
            <button id="showstudent">Show Students</button>
            <button id="countstatus">Count Status</button>
            <h2 id="showarea"></h2>
            <script>
                const students = [];
                const addstudents = document.getElementById('addstudent');
                const showstudent = document.getElementById('showstudent');
                const countstatus = document.getElementById('countstatus');
                const showarea = document.getElementById('showarea');
                addstudents.addEventListener('click', () => {
                    const name = document.getElementById('name').value;
                    const marks = Number(document.getElementById('marks').value);
                    const student = {
                        name: name,
                        marks: marks
                    };
                    students.push(student);
                    showarea.innerHTML = 'Student added!';
                });
                showstudent.addEventListener('click', () => {
                    showarea.innerHTML = '';
                for (const student of students){
                    if (student.marks >= 50){
                    showarea.innerHTML += `${student.name} - 'Passed' <br>`;
                    } else {
                    showarea.innerHTML += `${student.name} - Failed <br>`;
                    }
                    }
                });
                countstatus.addEventListener('click', () =>{
                    let passed = 0;
                    let failed = 0;
                    for (const student of students) {
                        if (student.marks >= 50) {
                            passed++;
                        } else {
                            failed++;
                        }
                    }
                    showarea.innerHTML = `Passed: ${passed} <br> Failed: ${failed}`;
                    });
            </script>
</body>
</html>
